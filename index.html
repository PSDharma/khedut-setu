      function detectCropKeyFromText(text) {
        const s = String(text || '').toLowerCase();
        if (/ઘઉં|wheat|ghau|गेहूं/.test(s)) return 'wheat';
        if (/બાજરી|bajra|बाजरा/.test(s)) return 'bajra';
        if (/જીરું|jeeru|cumin|जीरा/.test(s)) return 'cumin';
        if (/મગફળી|groundnut|magfali|मूंगफली/.test(s)) return 'groundnut';
        if (/કપાસ|cotton|kapas|कपास/.test(s)) return 'cotton';
        if (/ઘાસ|પુળિયા|fodder|ghas|चारा/.test(s)) return 'fodder';
        return 'paddy';
      }

      function computeFairPriceBadge(product) {
        const key = detectCropKeyFromText(`${product.title_gu || ''} ${product.title_en || ''}`);
        const base = AI_CROPS[key] || AI_CROPS.paddy;
        const unit = String(product.unit || '').toLowerCase();
        const price = Number(product.expected_price) || 0;
        if (!price) return null;
        let ref = base.mann;
        if (unit.includes('quintal')) ref = base.qtl; else if (unit.includes('kg')) ref = Math.round(base.mann / 20); else if (unit.includes('ton')) ref = base.qtl * 10;
        const ratio = price / ref;
        if (ratio <= 1.08) return { text: tr('ai_fair'), cls: 'bg-emerald-100 text-emerald-800' };
        if (ratio <= 1.25) return { text: tr('ai_market'), cls: 'bg-amber-100 text-amber-800' };
        return { text: tr('ai_prem'), cls: 'bg-indigo-100 text-indigo-800' };
      }

      function stopVoiceListening() { state.isListening = false; const btn = document.getElementById('voice-mic-trigger'); if (btn) { btn.classList.remove('voice-pulse', 'bg-red-600'); btn.classList.add('bg-farm-700'); } try { if (recognition) recognition.stop(); } catch {} }
      function processVoiceCommand(rawSpoken) {
        const spoken = cleanText(rawSpoken, 100); if (!spoken) return; const low = spoken.toLowerCase(); closeModal('voice-modal');
        if (/ai|સલાહ|ડૉક્ટર|advisor|doctor|सलाह/.test(low)) { switchTab('ai_advisor'); return; }
        if (/નવી ઉપજ|ઉપજ મૂકો|ફસલ|post crop|नई उपज/.test(low)) { switchTab('sell'); if (state.user) openProductModal(); return; }
        if (/માંગ|request|मांग/.test(low)) { switchTab('requests'); return; }
        if (/યાર્ડ|apmc|yard|ભાવ|भाव/.test(low)) { switchTab('yard'); switchYardSubtab('apmc'); return; }
        if (/ટેમ્પો|ટ્રેક્ટર|tempo|tractor|ट्रैक्टर/.test(low)) { switchTab('yard'); switchYardSubtab('transport'); return; }

        switchTab('market'); const sIn = document.getElementById('search-input'); if (sIn) sIn.value = spoken; loadProducts();
      }
      function startVoiceListening() {
        if (!SpeechRec) return;
        if (state.isListening) { stopVoiceListening(); return; }
        try {
          recognition = new SpeechRec(); recognition.lang = state.lang === 'hi' ? 'hi-IN' : state.lang === 'en' ? 'en-IN' : 'gu-IN';
          state.isListening = true; const btn = document.getElementById('voice-mic-trigger'); if (btn) { btn.classList.add('voice-pulse', 'bg-red-600'); btn.classList.remove('bg-farm-700'); }
          document.getElementById('voice-status').textContent = tr('voice_listening');
          let finalTxt = '';
          recognition.onresult = (ev) => { for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) finalTxt += ev.results[i][0].transcript; document.getElementById('voice-transcript').textContent = finalTxt; if (finalTxt.trim()) { stopVoiceListening(); processVoiceCommand(finalTxt.trim()); } };
          recognition.onerror = () => stopVoiceListening(); recognition.onend = () => { if (state.isListening) stopVoiceListening(); }; recognition.start();
        } catch { stopVoiceListening(); }
      }

      async function handleGoogleLogin() { await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } }); }
      async function handleLogin(e) { e.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: cleanText(document.getElementById('login-email').value, 120), password: document.getElementById('login-password').value }); if (error) showToast(error.message, 'error'); else switchTab('market'); }
      async function handleRegister(e) { e.preventDefault(); const { error } = await sb.auth.signUp({ email: cleanText(document.getElementById('reg-email').value, 120), password: document.getElementById('reg-password').value, options: { data: { full_name: cleanText(document.getElementById('reg-name').value, 80), mobile_number: sanitizeIndianPhone(document.getElementById('reg-mobile').value), role: document.getElementById('reg-role').value } } }); if (error) showToast(error.message, 'error'); else showToast('OK'); }
      async function handleLogout() { await sb.auth.signOut(); switchTab('market'); }

      function refreshAccountTab() {
        document.getElementById('auth-box').classList.toggle('hidden', Boolean(state.user));
        document.getElementById('profile-box').classList.toggle('hidden', !state.user);
        if (!state.user) return;
        const p = state.profile || {};
        document.getElementById('prof-display-name').textContent = p.full_name || state.user.email;
        document.getElementById('prof-display-email').textContent = state.user.email;
        document.getElementById('p-name').value = p.full_name || '';
        document.getElementById('p-business').value = p.business_name || '';
        document.getElementById('p-mobile').value = p.mobile_number || '';
        document.getElementById('p-village').value = p.village_city || '';
        document.getElementById('p-district').value = p.district || '';
        document.getElementById('p-state').value = p.state || 'Gujarat';
        document.getElementById('p-pin').value = p.pin_code || '';
        document.getElementById('p-upi').value = p.upi_id || '';
        document.getElementById('p-phone-ok').checked = Boolean(p.allow_phone_contact);
        document.getElementById('p-wa-ok').checked = Boolean(p.allow_whatsapp_contact);
        document.getElementById('p-upi-ok').checked = Boolean(p.allow_upi_payment);
        document.getElementById('admin-panel').classList.toggle('hidden', p.role !== 'admin');
      }

      async function handleProfileSave(e) {
        e.preventDefault(); if (!state.user) return;
        const { error } = await sb.from('profiles').update({
          full_name: cleanText(document.getElementById('p-name').value, 80),
          business_name: cleanText(document.getElementById('p-business').value, 100) || null,
          mobile_number: sanitizeIndianPhone(document.getElementById('p-mobile').value) || null,
          village_city: cleanText(document.getElementById('p-village').value, 80) || null,
          district: cleanText(document.getElementById('p-district').value, 80) || null,
          state: cleanText(document.getElementById('p-state').value, 60) || 'Gujarat',
          pin_code: document.getElementById('p-pin').value.trim() || null,
          upi_id: cleanText(document.getElementById('p-upi').value, 96).toLowerCase() || null,
          allow_phone_contact: Boolean(document.getElementById('p-phone-ok').checked),
          allow_whatsapp_contact: Boolean(document.getElementById('p-wa-ok').checked),
          allow_upi_payment: Boolean(document.getElementById('p-upi-ok').checked)
        }).eq('id', state.user.id);
        if (error) showToast(error.message, 'error'); else { showToast('OK'); const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle(); state.profile = data; refreshAccountTab(); }
      }

      async function handleAdminAddApmc(e) {
        e.preventDefault();
        const { error } = await sb.from('apmc_rates').insert({ yard_name: cleanText(document.getElementById('ap-yard').value, 80), district: cleanText(document.getElementById('ap-dist').value, 60), crop_name_gu: cleanText(document.getElementById('ap-crop').value, 80), min_price: safePositiveNumber(document.getElementById('ap-min').value, 0, 1000000), max_price: safePositiveNumber(document.getElementById('ap-max').value, 0, 1000000), modal_price: safePositiveNumber(document.getElementById('ap-modal').value, 0, 1000000), unit: cleanText(document.getElementById('ap-unit').value, 40) || '20 kg' });
        if (!error) { e.target.reset(); showToast('OK'); loadApmcRates(); }
      }

      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]'); if (!el) return;
        const a = el.getAttribute('data-action');
        if (a === 'nav-tab') switchTab(el.getAttribute('data-tab'));
        else if (a === 'set-lang') setLang(el.getAttribute('data-lang'));
        else if (a === 'reset-filters') resetFilters();
        else if (a === 'refresh-products') loadProducts();
        else if (a === 'refresh-apmc') loadApmcRates();
        else if (a === 'yard-subtab') switchYardSubtab(el.getAttribute('data-subtab'));
        else if (a === 'ai-subtab') switchAiSubtab(el.getAttribute('data-subtab'));
        else if (a === 'run-ai-price') runAiPriceEstimator();
        else if (a === 'run-ai-doctor') runAiCropDoctor();
        else if (a === 'run-ai-match') runAiSmartMatch();
        else if (a === 'ai-suggest-price-form') { const k = detectCropKeyFromText(document.getElementById('np-title-gu')?.value || ''); document.getElementById('np-price').value = String((AI_CROPS[k] || AI_CROPS.paddy).qtl); }
        else if (a === 'apply-ai-price-to-sell') applyAiPriceToSellModal(el.getAttribute('data-price'), el.getAttribute('data-title'));
        else if (a === 'open-voice') { openModal('voice-modal'); startVoiceListening(); }
        else if (a === 'toggle-voice-listen') startVoiceListening();
        else if (a === 'voice-example') processVoiceCommand(el.getAttribute('data-text'));
        else if (a === 'select-cat') { const id = el.getAttribute('data-id'); state.selectedCategory = isValidUUID(id) ? id : null; renderCategories(); loadProducts(); }
        else if (a === 'open-product') openProductDetail(el.getAttribute('data-id'));
        else if (a === 'open-transport-modal') { if (!state.user) switchTab('account'); else { populateLocalizedFormSelects(); openModal('add-transport-modal'); } }
        else if (a === 'open-request-modal') openRequestModal();
        else if (a === 'open-product-modal') openProductModal();
        else if (a === 'auth-mode') setAuthMode(el.getAttribute('data-mode'));
        else if (a === 'google-login') handleGoogleLogin();
        else if (a === 'logout') handleLogout();
        else if (a === 'close-modal') closeModal(el.getAttribute('data-modal'));
      });

      document.getElementById('search-input')?.addEventListener('input', debouncedLoadProducts);
      document.getElementById('district-filter')?.addEventListener('input', debouncedLoadProducts);
      document.getElementById('apmc-search')?.addEventListener('input', renderApmcRates);
      document.getElementById('transport-search')?.addEventListener('input', renderTransportList);
      document.getElementById('login-form')?.addEventListener('submit', handleLogin);
      document.getElementById('register-form')?.addEventListener('submit', handleRegister);
      document.getElementById('profile-form')?.addEventListener('submit', handleProfileSave);
      document.getElementById('add-product-form')?.addEventListener('submit', handleCreateProduct);
      document.getElementById('add-request-form')?.addEventListener('submit', handleCreateRequest);
      document.getElementById('admin-apmc-form')?.addEventListener('submit', handleAdminAddApmc);

      async function initApp() {
        updateOnlineBanner();
        setLang(state.lang);
        await loadCategories();
        const { data: { session } } = await sb.auth.getSession();
        state.user = session?.user || null;
        if (state.user) { const { data: prof } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle(); state.profile = prof; }
        refreshAccountTab();
        await loadProducts();
        refreshIcons();
      }
      initApp();
    })();
  </script>
</body>
</html>
