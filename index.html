      // Anti-Virus / Magic-Byte Verification + Canvas Sanitization for Uploaded Images
      async function sanitizeAndVerifyImage(file, maxBytes = CONFIG.MAX_UPLOAD_BYTES) {
        if (!file || !(file instanceof File)) return null;
        const limitMb = Math.max(1, Math.round(maxBytes / (1024 * 1024)));
        if (file.size <= 0 || file.size > maxBytes) {
          throw new Error(state.lang === 'en' ? `Image must be under ${limitMb} MB.` : state.lang === 'hi' ? `फोटो ${limitMb} MB से कम होना चाहिए।` : `ફોટો ${limitMb} MB થી ઓછો હોવો જોઈએ.`);
        }
        const allowedMimes = new Set(['image/jpeg', 'image/png', 'image/webp']);
        if (!allowedMimes.has(file.type)) {
          throw new Error(state.lang === 'en' ? 'Only JPG, PNG, or WEBP images allowed.' : state.lang === 'hi' ? 'केवल JPG, PNG या WEBP फोटो ही मान्य हैं।' : 'ફક્ત JPG, PNG અથવા WEBP ફોટો જ માન્ય છે.');
        }

        // Inspect raw magic bytes to reject disguised executables/HTML/scripts
        const headerBuf = await file.slice(0, 12).arrayBuffer();
        const bytes = new Uint8Array(headerBuf);
        const isJpeg = bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF;
        const isPng = bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4E && bytes[3] === 0x47;
        const isWebp = bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 &&
                       bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50;

        if (!isJpeg && !isPng && !isWebp) {
          throw new Error(state.lang === 'en' ? 'Invalid or corrupted image signature blocked.' : state.lang === 'hi' ? 'अमान्य या असुरक्षित फ़ाइल ब्लॉक की गई।' : 'અમાન્ય અથવા અસુરક્ષિત ફાઇલ બ્લોક કરવામાં આવી છે.');
        }

        // Re-encode via Canvas to strip any hidden EXIF/polyglot payloads
        const imgUrl = URL.createObjectURL(file);
        try {
          const img = await new Promise((resolve, reject) => {
            const el = new Image();
            el.onload = () => resolve(el);
            el.onerror = () => reject(new Error('Image decode failed'));
            el.src = imgUrl;
          });
          let w = img.naturalWidth || 0;
          let h = img.naturalHeight || 0;
          if (w <= 0 || h <= 0 || w > 8000 || h > 8000 || (w * h) > 40000000) {
            throw new Error(state.lang === 'en' ? 'Unsafe or oversized image dimensions blocked.' : state.lang === 'hi' ? 'असुरक्षित या बहुत बड़ी इमेज ब्लॉक की गई।' : 'અસુરક્ષિત અથવા અતિ મોટા માપનો ફોટો બ્લોક કરવામાં આવ્યો છે.');
          }
          const maxDim = 1080;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const cleanBlob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.84));
          if (!cleanBlob) throw new Error('Image sanitization failed');
          return cleanBlob;
        } finally {
          URL.revokeObjectURL(imgUrl);

          const r = Math.round(size * 0.22);
          ctx.fillStyle = '#15803d';
          ctx.beginPath();
          ctx.moveTo(r, 0);
          ctx.lineTo(size - r, 0);
          ctx.quadraticCurveTo(size, 0, size, r);
          ctx.lineTo(size, size - r);
          ctx.quadraticCurveTo(size, size, size - r, size);
          ctx.lineTo(r, size);
          ctx.quadraticCurveTo(0, size, 0, size - r);
          ctx.lineTo(0, r);
          ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#166534';
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size * 0.36, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = `${Math.round(size * 0.46)}px sans-serif`;
          ctx.textAlign = 'center';

      function localizeAgmarkCrop(rawName) {
        const clean = cleanText(rawName, 120);
        if (!clean) return '';
        const idx = state.lang === 'hi' ? 2 : state.lang === 'gu' ? 1 : 0;
        if (idx === 0) {
          // Clean duplicate parentheses in English too, e.g. "Carrot (Carrot)" -> "Carrot"
          const mEn = clean.match(/^([^(]+)\(([^)]+)\)\s*$/);
          if (mEn && mEn[1].trim().toLowerCase().replace(/[^a-z]/g, '') === mEn[2].trim().toLowerCase().replace(/[^a-z]/g, '')) {
            return mEn[1].trim();
          }
          return clean;
        }
        if (/[\u0A80-\u0AFF\u0900-\u097F]/.test(clean)) return clean;

        let mainPart = clean;
        let varPart = '';
        const parenAll = clean.match(/^([^(]+)\(([^)]+)\)(?:\s*\(([^)]+)\))?\s*$/);
        if (parenAll) {
          mainPart = parenAll[1].trim();
          varPart = (parenAll[3] || parenAll[2] || '').trim();
        }

        let localizedMain = '';
        for (const row of GOV_CROP_DICT) {
          if (row[0].test(mainPart) || row[0].test(clean)) {
            localizedMain = row[idx];
            break;
          }
        }
        if (!localizedMain) return clean;

        let localizedVar = '';
        if (varPart) {
          // Skip variety if it duplicates the crop name (e.g. Carrot (Carrot), Green Chilli (Green Chilly))
          const a = mainPart.toLowerCase().replace(/[^a-z]/g, '');
          const b = varPart.toLowerCase().replace(/[^a-z]/g, '');
          const isDup = a && b && (a === b || a.slice(0, 5) === b.slice(0, 5));
          if (!isDup) {
            for (const vRow of VARIETY_DICT) {
              if (vRow[0].test(varPart)) {
                localizedVar = vRow[idx];
                break;
              }
            }
          }
        }
        return localizedVar ? `${localizedMain} (${localizedVar})` : localizedMain;
      }

      function localizePlace(rawText) {
        const clean = cleanText(rawText, 120);
        if (!clean || state.lang === 'en') return clean;
        const idx = state.lang === 'hi' ? 2 : 1;
        let out = clean;
        for (const row of PLACE_DICT) {
          out = out.replace(row[0], row[idx]);
        }
        // Clean messy Agmarknet punctuation like "આણંદ(શાકભાજી યાર્ડ,આણંદ)" -> "આણંદ શાકભાજી યાર્ડ"
        out = out
          .replace(/\(\s*([^)]+)\s*\)/g, ' $1 ')
          .replace(/,/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        // Remove consecutive duplicate words (e.g. "આણંદ શાકભાજી યાર્ડ આણંદ" -> keep first)
        const words = out.split(' ');
        const deduped = [];
        for (const w of words) {
          if (deduped.length >= 1 && deduped[deduped.length - 1] === w) continue;
          if (deduped.length >= 2 && deduped[0] === w && w.length > 2) continue;
          deduped.push(w);
        }
        return deduped.join(' ');
      }

      function localizeSourceText(raw) {
        let s = cleanText(raw, 160);
        if (!s || state.lang === 'en') return s;
        if (state.lang === 'gu') {
          s = s
            .replace(/Govt\.?\s*Agmarknet\s*Live\s*(?:API|Feed)?/gi, 'સરકારી લાઇવ મંડી')

            .replace(/KHEDUT\s*SETU\s*Live\s*Gemini\s*AI/gi, 'ખેડૂત સેતુ લાઇવ AI')
            .replace(/KHEDUT\s*SETU\s*(?:Price\s*Engine|Engine|Advisor)/gi, 'ખેડૂત સેતુ AI એન્જિન')
            .replace(/Offline\s*Cached\s*APMC\s*Rates/gi, 'ઑફલાઇન સાચવેલા મંડી ભાવ')
            .replace(/Approved\s*APMC/gi, 'મંજૂર મંડી');
        } else if (state.lang === 'hi') {
          s = s
            .replace(/Govt\.?\s*Agmarknet\s*Live\s*(?:API|Feed)?/gi, 'सरकारी लाइव मंडी')
            .replace(/Khedut\s*Setu\s*Approved\s*APMC\s*(?:Database|DB|Feed)/gi, 'खेड़ूत सेतु स्वीकृत मंडी डेटा')
            .replace(/KHEDUT\s*SETU\s*Live\s*Gemini\s*AI/gi, 'खेड़ूत सेतु लाइव AI')
            .replace(/Offline\s*Cached\s*APMC\s*Rates/gi, 'ऑफ़लाइन सहेजे गए मंडी भाव');
        }
        return localizePlace(s);

      function populateAiCropSelect() {
        const aiCrop = document.getElementById('ai-crop-select');
        if (!aiCrop) return;
        const prev = aiCrop.value;
        const livePool = (Array.isArray(state.aiLiveRates) && state.aiLiveRates.length)
          ? state.aiLiveRates
          : (Array.isArray(state.apmcRates) ? state.apmcRates : []);

        const liveOpts = [];
        const seen = new Set();
        const mannWord = state.lang === 'en' ? '20kg' : state.lang === 'hi' ? 'मण' : 'મણ';
        livePool.forEach((r, idx) => {
          const modal = Number(r?.modal_price) || 0;
          if (modal <= 0) return;
          const title = localizeAgmarkCrop(r.crop_name_gu || r.crop_name_en || 'Crop');
          const yard = localizePlace(r.yard_name || 'APMC');
          const dist = localizePlace(r.district || '');
          const showDist = dist && !yard.includes(dist);
          const dedupeKey = `${title}|${yard}|${modal}`;
          if (seen.has(dedupeKey)) return;
          seen.add(dedupeKey);
          liveOpts.push(`<option value="live::${idx}">🟢 ${escapeHtml(title)} • ${escapeHtml(yard)}${showDist ? ` (${escapeHtml(dist)})` : ''} — ₹${formatSafeInr(modal)}/${mannWord}</option>`);

        const stdOpts = Object.keys(AI_CROPS)
          .map((k) => `<option value="${k}">${escapeHtml(AI_CROPS[k][state.lang] || AI_CROPS[k].gu)}</option>`)
          .join('');

        const liveGroupLabel = state.lang === 'en'
          ? `🟢 Live Govt Mandi Crops (${liveOpts.length})`

            ? `🟢 आज के सरकारी लाइव मंडी भाव (${liveOpts.length})`
            : `🟢 આજના સરકારી લાઇવ મંડી પાક (${liveOpts.length})`;
        const stdGroupLabel = state.lang === 'en'
          ? '🌾 All Major Indian Crops (37+)'
          : state.lang === 'hi'
            ? '🌾 भारत की सभी मुख्य फसलें (37+)'
            : '🌾 ભારતના તમામ મુખ્ય પાક (37+)';

        aiCrop.innerHTML =
          (liveOpts.length ? `<optgroup label="${escapeHtml(liveGroupLabel)}">${liveOpts.join('')}</optgroup>` : '') +
          `<optgroup label="${escapeHtml(stdGroupLabel)}">${stdOpts}</optgroup>`;

        if (prev && Array.from(aiCrop.options).some((o) => o.value === prev)) {
          aiCrop.value = prev;
        } else if (liveOpts.length) {
          aiCrop.selectedIndex = 0;
        } else {
          aiCrop.value = 'paddy';
        }

      async function loadAiLiveCrops(forceToast = false) {
        const reqId = ++latestAiCropsReqId;
        const statusEl = document.getElementById('ai-live-crops-status');
        const btn = document.getElementById('ai-load-live-btn');
        const scope = document.getElementById('ai-price-scope')?.value || 'gujarat';

        let stName = 'Gujarat';
        let dist = '';
        if (scope === 'district') {
          stName = cleanText(document.getElementById('apmc-state-filter')?.value || state.profile?.state || 'Gujarat', 60);
          dist = cleanText(document.getElementById('apmc-district-filter')?.value || document.getElementById('district-filter')?.value || state.profile?.district || '', 60);
        } else if (scope === 'india') {
          stName = '';
          dist = '';
        }

        if (btn) btn.disabled = true;
        if (statusEl) statusEl.textContent = state.lang === 'en' ? '⏳ Loading live government mandi crops...' : state.lang === 'hi' ? '⏳ सरकारी लाइव मंडी फसलें लोड हो रही हैं...' : '⏳ સરકારી લાઇવ મંડી પાક લોડ થઈ રહ્યા છે...';

        try {
          if (navigator.onLine) {
            const { data, error } = await withRetry(() =>
              sb.functions.invoke(CONFIG.AI_EDGE_FUNCTION, {
                body: { mode: 'daily_mandi', lang: state.lang, state: stName, district: dist }
              }), 1, 400
            );
            if (reqId !== latestAiCropsReqId) return;
            if (!error && data && Array.isArray(data.rates) && data.rates.length > 0) {
              state.aiLiveRates = data.rates;
              state.aiLiveSource = cleanText(data.source, 120) || 'Govt. Agmarknet Live';
              populateAiCropSelect();
              if (statusEl) statusEl.textContent = `🟢 ${data.rates.length} ${tr('lbl_rate_count')} (${localizeSourceText(state.aiLiveSource)})`;
              if (forceToast) showToast(state.lang === 'en' ? `✅ ${data.rates.length} live crops loaded!` : state.lang === 'hi' ? `✅ ${data.rates.length} सरकारी लाइव फसलें लोड हुईं!` : `✅ ${data.rates.length} સરકારી લાઇવ પાક લોડ થયા!`);
              return;
            }
          }
          if (reqId !== latestAiCropsReqId) return;
          if (!state.aiLiveRates.length && state.apmcRates.length) {
            state.aiLiveRates = state.apmcRates;
            state.aiLiveSource = state.mandiSource || 'Khedut Setu APMC';
          }
          populateAiCropSelect();
          if (statusEl) statusEl.textContent = state.aiLiveRates.length
            ? `📦 ${state.aiLiveRates.length} ઉપલબ્ધ ભાવ લોડ થયા`
            : 'ℹ️ 37+ મુખ્ય પાક તૈયાર છે (કોઈપણ પાક પસંદ કરો અથવા ઉપર લખો)';

      function stopVoiceListening() {
        state.isListening = false;
        const btn = document.getElementById('voice-mic-trigger');

      function processVoiceCommand(rawSpoken) {
        const spoken = cleanText(rawSpoken, 100);
        if (!spoken) return;
        const low = spoken.toLowerCase();
        closeModal('voice-modal');

        if (/યોજના|સહાય|હપ્તો|સબસિડી|kisan|ikhedut|scheme|subsidy|pmfby|loan|योजना|किस्त|सब्सिडी/.test(low)) { switchTab('yard'); switchYardSubtab('schemes'); return; }
        if (/કેન્દ્ર|દુકાન|kvk|center|shop|fertilizer center|કૃષિ કેન્દ્ર|केंद्र|दुकान/.test(low)) { switchTab('yard'); switchYardSubtab('centers'); return; }
        if (/ફોટો|ફાઇલ|સમસ્યા|નિવારણ|photo|file|upload|problem|समस्या/.test(low)) { switchTab('ai_advisor'); switchAiSubtab('multimodal'); return; }
        if (/ai|સલાહ|ડૉક્ટર|advisor|doctor|सलाह/.test(low)) { switchTab('ai_advisor'); return; }
        if (/દવા|બિયારણ|ખાતર|સાધન|યંત્ર|input|seed|pesticide|दवा|बीज|यंत्र/.test(low)) { switchTab('yard'); switchYardSubtab('inputs'); return; }
        if (/ટેમ્પો|ટ્રેક્ટર|વાહન|tempo|tractor|ट्रैक्टर/.test(low)) { switchTab('yard'); switchYardSubtab('transport'); return; }
        if (/મંડી|શાકભાજી|ફળ|ફૂલ|કઠોળ|અનાજ|apmc|yard|mandi|ભાવ|भाव/.test(low)) {
          switchTab('yard'); switchYardSubtab('apmc');
          if (/શાકભાજી|veg|सब्ज़ी/.test(low)) state.mandiCatFilter = 'vegetables';
          else if (/ફળ|fruit|फल/.test(low)) state.mandiCatFilter = 'fruits';
          else if (/ફૂલ|flower|फूल/.test(low)) state.mandiCatFilter = 'flowers';
          else if (/કઠોળ|pulse|दलहन/.test(low)) state.mandiCatFilter = 'pulses';
          else if (/અનાજ|grain|अनाज/.test(low)) state.mandiCatFilter = 'grains';
          renderApmcRates();
          return;
        }
        if (/નવી ઉપજ|ઉપજ મૂકો|વેચાણ|sell|post crop|नई उपज/.test(low)) { switchTab('sell'); return; }
        if (/માંગ|request|मांग/.test(low)) { switchTab('requests'); return; }
        if (/ખાતું|account|खाता/.test(low)) { switchTab('account'); return; }

        const cleaned = spoken.replace(/(શોધો|બતાવો|ખોલો|search|find|show|खोजो|दिखाओ)/gi, '').trim();
        switchTab('market');
        const sIn = document.getElementById('search-input');
        if (sIn) sIn.value = cleaned || spoken;
        loadProducts();
      }

      function startVoiceListening() {
        const statusEl = document.getElementById('voice-status');
        const trEl = document.getElementById('voice-transcript');
        if (!SpeechRec) {
          if (statusEl) statusEl.textContent = state.lang === 'en' ? 'Voice API not supported in this browser.' : state.lang === 'hi' ? 'इस ब्राउज़र में वॉइस समर्थित नहीं है।' : 'આ બ્રાઉઝરમાં વૉઇસ સપોર્ટ ઉપલબ્ધ નથી.';
          return;
        }
        if (state.isListening) { stopVoiceListening(); return; }
        try {
          recognition = new SpeechRec();
          recognition.lang = state.lang === 'hi' ? 'hi-IN' : state.lang === 'en' ? 'en-IN' : 'gu-IN';
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;
          state.isListening = true;
          const btn = document.getElementById('voice-mic-trigger');
          if (btn) { btn.classList.add('voice-pulse', 'bg-red-600'); btn.classList.remove('bg-farm-700'); }
          if (statusEl) statusEl.textContent = state.lang === 'en' ? 'Listening... 🎙️' : state.lang === 'hi' ? 'सुन रहा हूँ... बोलिए 🎙️' : 'સાંભળી રહ્યો છું... બોલો 🎙️';
          if (trEl) trEl.textContent = '';

          let finalTxt = '';
          recognition.onresult = (ev) => {
            let interim = '';
            for (let i = ev.resultIndex; i < ev.results.length; i++) {
              const txt = ev.results[i][0].transcript;
              if (ev.results[i].isFinal) finalTxt += txt;
              else interim += txt;
            }
            if (trEl) trEl.textContent = `"${(finalTxt || interim).trim()}"`;
            if (finalTxt.trim()) { stopVoiceListening(); processVoiceCommand(finalTxt.trim()); }
          };
          recognition.onerror = (ev) => {
            stopVoiceListening();
            const errCode = ev?.error || '';
            if (statusEl) {
              if (errCode === 'not-allowed' || errCode === 'service-not-allowed') {
                statusEl.textContent = state.lang === 'en' ? 'Microphone permission denied. Please allow mic access.' : state.lang === 'hi' ? 'माइक की अनुमति नहीं मिली। कृपया ब्राउज़र में माइक अनुमति दें।' : 'માઇકની પરમિશન બંધ છે — કૃપા કરીને બ્રાઉઝરમાં માઇક ચાલુ કરો.';
              } else if (errCode === 'no-speech') {
                statusEl.textContent = state.lang === 'en' ? 'No voice detected. Tap mic and try again.' : state.lang === 'hi' ? 'आवाज़ सुनाई नहीं दी। माइक दबाकर फिर बोलें।' : 'અવાજ સંભળાયો નહીં. માઇક દબાવીને ફરી બોલો.';
              } else {
                statusEl.textContent = tr('voice_prompt');
              }
            }
          };
          recognition.onend = () => { if (state.isListening) stopVoiceListening(); };
          recognition.start();
        } catch { stopVoiceListening(); }
      }

      function speakTextAloud(text) {
        const clean = cleanText(text, 800);
        if (!clean) {
          showToast(state.lang === 'en' ? 'No answer to read aloud yet.' : state.lang === 'hi' ? 'सुनने के लिए अभी कोई जवाब नहीं है।' : 'સાંભળવા માટે હજુ કોઈ જવાબ નથી.', 'error');
          return;
        }
        try {
          if (!('speechSynthesis' in window)) {
            showToast('Voice playback not supported in this browser.', 'error');
            return;
          }
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = state.lang === 'hi' ? 'hi-IN' : state.lang === 'en' ? 'en-IN' : 'gu-IN';
          utter.rate = 0.95;
          window.speechSynthesis.speak(utter);
        } catch {}
      }

      async function runAiPrice() {
        const out = document.getElementById('ai-price-output');
        if (!out) return;
        if (!checkRateLimit('ai_price_call', 600)) return;
        const reqId = ++latestPriceReqId;

        const qty = safePositiveNumber(document.getElementById('ai-qty-input')?.value, 1, 100000) ?? 50;

        // Case 3: Query Edge Function live (District -> State -> All-India smart fallback)

        try {

              const perMann = isGovLive
                ? (safePositiveNumber(bestPayload.estimated_per_mann_inr, 0.01, 10000000) ?? Math.round((stdCrop?.mann || 470) * qualMult))
                : (stdCrop ? Math.round(stdCrop.mann * qualMult) : (safePositiveNumber(bestPayload.estimated_per_mann_inr, 0.01, 10000000) ?? 470));
              const totalInr = Math.round(perMann * qty);
              const metaRaw = bestPayload.metadata && typeof bestPayload.metadata === 'object' ? bestPayload.metadata : {};
              renderLiveCard(displayCrop, perMann, totalInr, {
                source: isGovLive ? cleanText(metaRaw.source, 140) : 'Khedut Setu Reference Calibration (આજે સરકારી ફીડમાં આ પાકની હરાજી નથી)',

              });
              return;

          if (reqId !== latestPriceReqId) return;

      async function handleMultimodalFileSelect(file) {
        const preview = document.getElementById('ai-multi-preview');
        state.multiFile = null;
        if (!file) {
          if (preview) { preview.classList.add('hidden'); preview.innerHTML = ''; }
          return;
        }
        const MAX_AI_BYTES = 3 * 1024 * 1024;
        if (file.size <= 0 || file.size > MAX_AI_BYTES) {
          showToast(state.lang === 'en' ? 'File must be under 3 MB.' : state.lang === 'hi' ? 'फ़ाइल 3 MB से कम होनी चाहिए।' : 'ફાઇલ 3 MB થી ઓછી હોવી જોઈએ.', 'error');
          return;
        }
        const allowed = new Set(['image/jpeg', 'image/png', 'image/webp', 'application/pdf', 'text/plain']);
        if (!allowed.has(file.type)) {
          showToast(state.lang === 'en' ? 'Only JPG, PNG, WEBP, PDF, or TXT allowed.' : state.lang === 'hi' ? 'केवल JPG, PNG, WEBP, PDF या TXT मान्य हैं।' : 'ફક્ત JPG, PNG, WEBP, PDF અથવા TXT જ માન્ય છે.', 'error');
          return;
        }

        // Magic-byte anti-virus signature check
        const buf = await file.slice(0, 12).arrayBuffer();
        const b = new Uint8Array(buf);
        const isJpeg = b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF;
        const isPng = b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47;
        const isWebp = b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50;
        const isPdf = b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46;
        const isTxt = file.type === 'text/plain';
        if (isTxt) {
          // Reject binary/executable files disguised as .txt (null bytes or ELF/MZ/PE magic headers)
          const headSample = new Uint8Array(await file.slice(0, 512).arrayBuffer());
          const hasNullByte = headSample.some((byte) => byte === 0x00);
          const isExe = (headSample[0] === 0x4D && headSample[1] === 0x5A) || (headSample[0] === 0x7F && headSample[1] === 0x45);
          if (hasNullByte || isExe) {
            showToast(state.lang === 'en' ? 'Binary file disguised as text blocked.' : state.lang === 'hi' ? 'असुरक्षित फ़ाइल ब्लॉक की गई।' : 'ટેક્સ્ટના નામે અસુરક્ષિત ફાઇલ બ્લોક કરવામાં આવી છે.', 'error');
            return;
          }
        }

        if (!isJpeg && !isPng && !isWebp && !isPdf && !isTxt) {
          showToast(state.lang === 'en' ? 'Unsafe or invalid file signature blocked.' : state.lang === 'hi' ? 'असुरक्षित फ़ाइल ब्लॉक की गई।' : 'અસુરક્ષિત ફાઇલ બ્લોક કરવામાં આવી છે.', 'error');
          return;
        }

        let processedFile = file;
        const isImg = isJpeg || isPng || isWebp;
        if (isImg) {
          try {
            const compressedBlob = await sanitizeAndVerifyImage(file, MAX_AI_BYTES);
            if (compressedBlob) processedFile = compressedBlob;
          } catch (err) {
            showToast(err?.message || 'Image error', 'error');
            return;
          }
        }
        const effectiveMime = isImg ? 'image/jpeg' : file.type;
        const effectiveSize = processedFile.size || file.size;
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = String(reader.result || '');
          const base64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : '';
          state.multiFile = {
            name: cleanText(file.name, 100) || 'upload',
            type: effectiveMime,
            sizeKb: Math.max(1, Math.round(effectiveSize / 1024)),
            base64,
            dataUrl: isImg ? dataUrl : ''
          };
          if (preview) {
            preview.classList.remove('hidden');
            preview.innerHTML = `
              <div class="flex items-center gap-2.5 min-w-0">
                ${state.multiFile.dataUrl ? `<img src="${escapeHtml(state.multiFile.dataUrl)}" class="w-12 h-12 rounded-lg object-cover border shrink-0" />` : `<div class="w-12 h-12 rounded-lg bg-farm-100 text-farm-800 flex items-center justify-center text-lg shrink-0">📄</div>`}
                <div class="min-w-0">
                  <div class="text-xs font-bold text-slate-900 truncate">${escapeHtml(state.multiFile.name)}</div>
                  <div class="text-[11px] text-slate-500">${escapeHtml(state.multiFile.sizeKb)} KB • ✅ ${escapeHtml(state.lang === 'en' ? 'Verified' : state.lang === 'hi' ? 'सुरक्षित' : 'સુરક્ષિત')}</div>
                </div>
              </div>
              <button type="button" data-action="clear-ai-file" class="px-2.5 py-1 rounded-lg bg-red-50 text-red-700 text-xs font-bold shrink-0">✕</button>
            `;
          }
        };
        reader.onerror = () => {
          state.multiFile = null;
          showToast(state.lang === 'en' ? 'Failed to read file. Please try again.' : state.lang === 'hi' ? 'फ़ाइल पढ़ने में त्रुटि हुई।' : 'ફાઇલ વાંચવામાં ભૂલ આવી. ફરી પ્રયાસ કરો.', 'error');
        };
        reader.readAsDataURL(processedFile);
      }

              const resolvedMeta = Object.assign({}, metaRaw, {

        Object.entries(panels).forEach(([k, id]) => document.getElementById(id)?.classList.toggle('hidden', k !== w));

      async function loadApmcRates(forceToast = false) {
        const reqId = ++latestApmcReqId;
        const listBox = document.getElementById('apmc-list');
        const refreshBtn = document.getElementById('apmc-refresh-btn');
        const statusEl = document.getElementById('apmc-live-status');

        if (refreshBtn) refreshBtn.disabled = true;
        if (listBox && !state.apmcRates.length) {
          listBox.innerHTML = Array.from({ length: 4 }).map(() =>
            `<div class="bg-white rounded-2xl p-4 border border-slate-200 animate-pulse space-y-3"><div class="h-4 bg-slate-200 rounded w-1/2"></div><div class="h-3 bg-slate-100 rounded w-2/3"></div><div class="grid grid-cols-3 gap-2"><div class="h-12 bg-slate-100 rounded-xl"></div><div class="h-12 bg-farm-50 rounded-xl"></div><div class="h-12 bg-slate-100 rounded-xl"></div></div></div>`
          ).join('');
        }

        const stName = cleanText(document.getElementById('apmc-state-filter')?.value || document.getElementById('state-filter')?.value || state.profile?.state || 'Gujarat', 60);
        const dist = cleanText(document.getElementById('apmc-district-filter')?.value || document.getElementById('district-filter')?.value || state.profile?.district || '', 60);

        let mergedRows = null;
        let sourceLabel = 'Khedut Setu APMC Database';

        try {
          if (navigator.onLine) {
            const { data: edgeData, error: edgeErr } = await withRetry(() =>
              sb.functions.invoke(CONFIG.AI_EDGE_FUNCTION, {
                body: { mode: 'daily_mandi', lang: state.lang, state: stName, district: dist }
              }), 1, 400
            );
            if (reqId !== latestApmcReqId) return;
            if (!edgeErr && edgeData && Array.isArray(edgeData.rates) && edgeData.rates.length > 0) {
              mergedRows = edgeData.rates;
              sourceLabel = cleanText(edgeData.source, 120) || 'Govt. Agmarknet Live Feed';
            }
          }

          if (!Array.isArray(mergedRows) || mergedRows.length === 0) {
            const { data } = await withRetry(() =>
              sb.from('apmc_rates')
                .select('*')
                .order('rate_date', { ascending: false })
                .order('created_at', { ascending: false })
                .limit(100)
            );
            if (reqId !== latestApmcReqId) return;
            if (Array.isArray(data) && data.length > 0) {
              mergedRows = data;
              sourceLabel = 'Khedut Setu Approved APMC Database';
            }
          }

          if (Array.isArray(mergedRows)) {
            state.apmcRates = mergedRows;
            state.mandiSource = sourceLabel;
            state.mandiLastSync = new Date().toLocaleTimeString(state.lang === 'hi' ? 'hi-IN' : state.lang === 'en' ? 'en-IN' : 'gu-IN', { hour: '2-digit', minute: '2-digit' });
            saveCache('apmc', mergedRows);
            if (forceToast) showToast(state.lang === 'en' ? `✅ ${mergedRows.length} live mandi rates updated!` : state.lang === 'hi' ? `✅ ${mergedRows.length} लाइव मंडी भाव अपडेट हुए!` : `✅ ${mergedRows.length} લાઇવ મંડી ભાવ અપડેટ થયા!`);
          } else {
            state.apmcRates = loadCache('apmc') || [];
            state.mandiSource = 'Offline Cached APMC Rates';
          }
        } catch {
          if (reqId !== latestApmcReqId) return;
          state.apmcRates = loadCache('apmc') || [];
          state.mandiSource = 'Offline Cached APMC Rates';
        } finally {
          if (refreshBtn) refreshBtn.disabled = false;
          if (statusEl) {
            const isGov = /agmarknet|data\.gov/i.test(state.mandiSource);
            statusEl.innerHTML = `<span>${isGov ? '🟢' : '📦'} ${escapeHtml(localizeSourceText(state.mandiSource))}${state.mandiLastSync ? ` • 🕒 ${escapeHtml(state.mandiLastSync)}` : ''}</span><span id="apmc-live-count" class="font-extrabold">${state.apmcRates.length} ${escapeHtml(tr('lbl_rate_count'))}</span>`;
          }
          if (!state.aiLiveRates.length && state.apmcRates.length) {
            state.aiLiveRates = state.apmcRates;
            state.aiLiveSource = state.mandiSource;
          }
          populateAiCropSelect();
          renderApmcRates();
        }
      }

      function renderApmcRates() {
        const box = document.getElementById('apmc-list'); if (!box) return;
        const term = cleanText(document.getElementById('apmc-search')?.value, 60).toLowerCase();
        const sortMode = document.getElementById('apmc-sort')?.value || 'latest';
        const isQuintal = state.mandiUnitMode === 'quintal';
        const mult = isQuintal ? 5 : 1;
        const unitText = state.lang === 'en'
          ? (isQuintal ? '100 kg (Quintal)' : '20 kg (Mann)')
          : state.lang === 'hi'
            ? (isQuintal ? '100 किग्रा (क्विंटल)' : '20 किग्रा (मण)')
            : (isQuintal ? '100 કિલો (ક્વિન્ટલ)' : '20 કિલો (મણ)');

        const unitBtn = document.getElementById('mandi-unit-toggle');
        if (unitBtn) unitBtn.textContent = `⚖️ ${unitText}`;

        let list = state.apmcRates.filter((r) => {
          const visOk = r.approval_status === 'approved' || (state.user && r.submitted_by === state.user.id) || isStrictAdminReady();
          const catOk = state.mandiCatFilter === 'all' || (r.rate_category || 'grains') === state.mandiCatFilter;
          if (!visOk || !catOk) return false;
          if (!term) return true;
          const locCrop = localizeAgmarkCrop(r.crop_name_gu || r.crop_name_en || '');
          const locYard = localizePlace(r.yard_name || '');
          const locDist = localizePlace(r.district || '');
          const hay = `${r.yard_name || ''} ${r.district || ''} ${r.crop_name_gu || ''} ${r.crop_name_en || ''} ${locCrop} ${locYard} ${locDist}`.toLowerCase();
          return hay.includes(term);
        });

        if (sortMode === 'high') list = [...list].sort((a, b) => (Number(b.modal_price) || 0) - (Number(a.modal_price) || 0));
        else if (sortMode === 'low') list = [...list].sort((a, b) => (Number(a.modal_price) || 0) - (Number(b.modal_price) || 0));

        const countEl = document.getElementById('apmc-live-count');
        if (countEl) countEl.textContent = `${list.length} ${tr('lbl_rate_count')}`;

        if (!list.length) {
          box.innerHTML = `<div class="col-span-full bg-white p-6 rounded-2xl text-center text-xs text-slate-500 border border-slate-200">${escapeHtml(tr('no_products'))}</div>`;
          return;
        }

        let bestRow = null;
        for (const r of list) {
          if ((Number(r.modal_price) || 0) > (Number(bestRow?.modal_price) || 0)) bestRow = r;

      async function loadProducts() {
        const reqId = ++latestProductsReqId;
        // Explicit safe columns (never expose raw contact_number in public list)
        let q = sb.from('products')
          .select('id, seller_id, category_id, reference_code, title_gu, title_hi, title_en, available_quantity, unit, expected_price, price_unit, village, district, state, image_paths, status, created_at')
          .eq('status', 'approved')
          .is('deleted_at', null)
          .order('created_at', { ascending: false })
          .limit(60);
        if (isValidUUID(state.selectedCategory)) q = q.eq('category_id', state.selectedCategory);
        const stFilter = cleanText(document.getElementById('state-filter')?.value, 60);
        if (stFilter) q = q.eq('state', stFilter);
        const dist = cleanText(document.getElementById('district-filter')?.value, 60).replace(/[%_]/g, '');
        if (dist) q = q.ilike('district', `%${dist}%`);
        const { data } = await withRetry(() => q);
        if (reqId !== latestProductsReqId) return; // Ignore stale out-of-order response
        if (Array.isArray(data)) saveCache('products', data);
        const term = cleanText(document.getElementById('search-input')?.value, 80).toLowerCase();
        let list = Array.isArray(data) ? data : (loadCache('products') || []);
        if (term) list = list.filter((p) =>
          (p.title_gu || '').toLowerCase().includes(term) ||
          (p.title_hi || '').toLowerCase().includes(term) ||
          (p.title_en || '').toLowerCase().includes(term) ||
          (p.village || '').toLowerCase().includes(term) ||
          (p.district || '').toLowerCase().includes(term) ||
          (p.state || '').toLowerCase().includes(term)
        );
        state.products = list;
        const pulse = document.getElementById('ai-pulse-summary');
        if (pulse) pulse.textContent = `${list.length} ${tr('active_items_lbl')}`;
        renderProducts();
      }

            ${safeUpi ? `

                <a href="${escapeHtml(upiDeepLink)}" class="block w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-center text-xs">

          sb.from('products')
            .select('id, title_gu, available_quantity, unit, expected_price, village, district, state, status, created_at')
            .eq('seller_id', state.user.id)
            .is('deleted_at', null)
            .order('created_at', { ascending: false })
            .limit(40)
        );
        state.myProducts = Array.isArray(data) ? data : [];

                  <h4 class="font-bold text-slate-900 text-sm mt-1">${escapeHtml(p.title_gu)}</h4>
                  <p class="text-xs text-slate-500">📍 ${escapeHtml([localizePlace(p.village), localizePlace(p.district), localizeStateName(p.state)].filter(Boolean).join(', '))}</p>
                </div>
                <div class="text-right font-extrabold text-farm-800 text-sm">₹${formatSafeInr(p.expected_price)}/${escapeHtml(localizeUnit(p.unit))}</div>
              </div>
              <div class="pt-2 border-t border-slate-100 flex gap-2">
                ${p.status === 'approved' ? `<button type="button" data-action="mark-product-sold" data-id="${escapeHtml(p.id)}" class="flex-1 bg-slate-800 text-white text-xs font-bold py-1.5 rounded-lg">${escapeHtml(tr('btn_mark_sold'))}</button>` : ''}
                <button type="button" data-action="delete-my-product" data-id="${escapeHtml(p.id)}" class="px-3 py-1.5 rounded-lg bg-red-50 text-red-700 text-xs font-bold">${escapeHtml(tr('btn_delete'))}</button>

      async function loadBuyerRequests() {
        const { data } = await withRetry(() => sb.from('public_buyer_requests').select('*').limit(30));

        document.getElementById('sell-guest-box')?.classList.toggle('hidden', Boolean(state.user));
        document.getElementById('sell-workspace')?.classList.toggle('hidden', !state.user);
        if (state.user) loadMyListings();

      function refreshAccountTab() {
        document.getElementById('auth-box')?.classList.toggle('hidden', Boolean(state.user));
        document.getElementById('profile-box')?.classList.toggle('hidden', !state.user);
        if (!state.user) return;
        const p = state.profile || {};
        document.getElementById('prof-display-name').textContent = p.full_name || state.user.email;
        document.getElementById('prof-display-email').textContent = state.user.email;
        document.getElementById('p-name').value = p.full_name || '';
        document.getElementById('p-mobile').value = p.mobile_number || '';
        document.getElementById('p-village').value = p.village_city || '';
        document.getElementById('p-district').value = p.district || '';
        if (p.state) {
          document.getElementById('p-state').value = p.state;
          const asf = document.getElementById('apmc-state-filter');
          if (asf && !asf.dataset.userEdited && INDIA_STATES.includes(p.state)) asf.value = p.state;
        }
        if (p.district) {
          const adf = document.getElementById('apmc-district-filter');
          if (adf && !adf.value && !adf.dataset.userEdited) adf.value = p.district;

      // ==================== UNIFIED EVENT DELEGATION ====================
      document.addEventListener('click', async (e) => {
        if (e.target?.classList?.contains('modal-backdrop') && e.target.id) {
          if (e.target.id === 'voice-modal') stopVoiceListening();
          closeModal(e.target.id);
          return;
        }
        const el = e.target.closest('[data-action]'); if (!el) return;
        const a = el.getAttribute('data-action');
        if (a === 'install-app') { await triggerInstallApp(); return; }
        if (a === 'share-app') { await shareKhedutSetuApp(); return; }
        if (a === 'nav-tab') switchTab(el.getAttribute('data-tab'));
        else if (a === 'set-lang') setLang(el.getAttribute('data-lang'));
        else if (a === 'reset-filters') {
          document.getElementById('search-input').value = '';
          document.getElementById('district-filter').value = '';
          document.getElementById('state-filter').value = '';
          state.selectedCategory = null;
          renderCategories();
          loadProducts();
        }
        else if (a === 'refresh-products') loadProducts();
        else if (a === 'refresh-my-listings') loadMyListings();
        else if (a === 'refresh-apmc') loadApmcRates(true);
        else if (a === 'toggle-mandi-unit') {
          state.mandiUnitMode = state.mandiUnitMode === 'mann' ? 'quintal' : 'mann';
          renderApmcRates();
        }
        else if (a === 'share-mandi-rate') {
          const r = state.apmcRates.find((x) => String(x.id) === el.getAttribute('data-id'));
          if (r) {
            const mult = state.mandiUnitMode === 'quintal' ? 5 : 1;
            const unitTxt = state.mandiUnitMode === 'quintal' ? '100 કિલો (ક્વિન્ટલ)' : '20 કિલો (મણ)';
            const cNm = localizeAgmarkCrop(r.crop_name_gu || r.crop_name_en || '');
            const yNm = localizePlace(r.yard_name || '');
            const dNm = localizePlace(r.district || '');
            const locS = (dNm && !yNm.includes(dNm)) ? `${yNm} (${dNm})` : yNm;
            const msg = `🌾 *ખેડૂત સેતુ — આજના મંડી ભાવ*\n📌 ${cNm}\n📍 ${locS} | ${r.rate_date}\n💰 નીચો: ₹${formatSafeInr((Number(r.min_price) || 0) * mult)} | સરેરાશ: ₹${formatSafeInr((Number(r.modal_price) || 0) * mult)} | ઊંચો: ₹${formatSafeInr((Number(r.max_price) || 0) * mult)} (${unitTxt})\n🔗 ${window.location.origin + window.location.pathname}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank', 'noopener,noreferrer');
          }
        }
        else if (a === 'calc-mandi-rate') {
          const idAttr = el.getAttribute('data-id');
          const r = state.apmcRates.find((x) => String(x.id) === idAttr);
          if (r) {
            state.aiLiveRates = [...state.apmcRates];
            state.aiLiveSource = state.mandiSource || 'Govt. Agmarknet Live';
            const matchIdx = state.aiLiveRates.findIndex((x) => String(x.id) === idAttr);
            switchTab('ai_advisor');
            switchAiSubtab('price');
            populateAiCropSelect();
            const customEl = document.getElementById('ai-crop-custom');
            if (customEl) customEl.value = '';
            const selEl = document.getElementById('ai-crop-select');
            if (selEl && matchIdx >= 0) selEl.value = `live::${matchIdx}`;
            runAiPrice();
          }
        }
        else if (a === 'pd-go-login') {
          closeModal('product-detail-modal');
          switchTab('account');
        }
        else if (a === 'yard-subtab') switchYardSubtab(el.getAttribute('data-subtab'));
        else if (a === 'ai-subtab') switchAiSubtab(el.getAttribute('data-subtab'));
        else if (a === 'run-ai-price') runAiPrice();
        else if (a === 'load-ai-live-crops') loadAiLiveCrops(true);
        else if (a === 'run-ai-doctor') runAiDoctor();
        else if (a === 'run-ai-match') runAiMatch();
        else if (a === 'run-ai-multimodal') runAiMultimodal();
        else if (a === 'speak-ai-answer') speakTextAloud(lastAiSpokenText);
        else if (a === 'clear-ai-file') {
          state.multiFile = null;
          const fi = document.getElementById('ai-multi-file'); if (fi) fi.value = '';
          const pv = document.getElementById('ai-multi-preview'); if (pv) { pv.classList.add('hidden'); pv.innerHTML = ''; }
        }
        else if (a === 'clear-ai-multimodal') {
          state.multiFile = null; lastAiSpokenText = '';
          const q = document.getElementById('ai-multi-query'); if (q) q.value = '';
          const fi = document.getElementById('ai-multi-file'); if (fi) fi.value = '';
          const pv = document.getElementById('ai-multi-preview'); if (pv) { pv.classList.add('hidden'); pv.innerHTML = ''; }
          const out = document.getElementById('ai-multi-output'); if (out) out.innerHTML = '';
        }
        else if (a === 'voice-fill-ai') {
          if (!SpeechRec) { showToast('Voice API not supported in this browser.', 'error'); return; }
          try {
            const rec = new SpeechRec();
            rec.lang = state.lang === 'hi' ? 'hi-IN' : state.lang === 'en' ? 'en-IN' : 'gu-IN';
            rec.interimResults = false;
            showToast(state.lang === 'en' ? '🎙️ Listening...' : state.lang === 'hi' ? '🎙️ सुन रहा हूँ... बोलिए' : '🎙️ સાંભળી રહ્યો છું... બોલો');
            rec.onresult = (ev) => {
              const spoken = cleanText(ev.results?.[0]?.[0]?.transcript || '', 400);
              const qEl = document.getElementById('ai-multi-query');
              if (qEl && spoken) { qEl.value = spoken; runAiMultimodal(); }
            };
            rec.start();
          } catch {}
        }
        else if (a === 'open-schemes-hub') { switchTab('yard'); switchYardSubtab('schemes'); }
        else if (a === 'open-centers-hub') { switchTab('yard'); switchYardSubtab('centers'); }
        else if (a === 'open-ai-multimodal') { switchTab('ai_advisor'); switchAiSubtab('multimodal'); }
        else if (a === 'set-scheme-cat') { state.schemeCatFilter = el.getAttribute('data-cat') || 'all'; renderChips(); renderSchemes(); }
        else if (a === 'set-center-type') { state.centerTypeFilter = el.getAttribute('data-type') || 'all'; renderChips(); renderAgriCenters(); }
        else if (a === 'open-maps-nearby') {
          const dist = cleanText(document.getElementById('center-search')?.value || document.getElementById('district-filter')?.value || state.profile?.district || 'Gujarat', 60);
          const q = encodeURIComponent(`fertilizer seed pesticide agro center near ${dist}`);
          window.open(`https://www.google.com/maps/search/?api=1&query=${q}`, '_blank', 'noopener,noreferrer');
        }
        else if (a === 'set-mandi-cat') { state.mandiCatFilter = el.getAttribute('data-cat') || 'all'; renderChips(); renderApmcRates(); }
        else if (a === 'set-agri-type') { state.agriInputTypeFilter = el.getAttribute('data-type') || 'all'; renderChips(); renderAgriInputs(); }
        else if (a === 'open-mandi-rate-modal') openMandiRateModal(null);
        else if (a === 'edit-mandi-rate') { const r = state.apmcRates.find((x) => x.id === el.getAttribute('data-id')); if (r) openMandiRateModal(r); }
        else if (a === 'open-agri-input-modal') openAgriInputModal(null);
        else if (a === 'edit-agri-input') { const it = state.agriInputs.find((x) => x.id === el.getAttribute('data-id')); if (it) openAgriInputModal(it); }
        else if (a === 'open-transport-modal') { if (!state.user) switchTab('account'); else openModal('add-transport-modal'); }
        else if (a === 'open-request-modal') { if (!state.user) switchTab('account'); else openModal('add-request-modal'); }
        else if (a === 'open-product-modal') { if (!state.user) switchTab('account'); else openModal('add-product-modal'); }
        else if (a === 'open-product-detail') await openProductDetailModal(el.getAttribute('data-id'));
        else if (a === 'select-cat') { const id = el.getAttribute('data-id'); state.selectedCategory = isValidUUID(id) ? id : null; renderCategories(); loadProducts(); }
        else if (a === 'auth-mode') {
          const m = el.getAttribute('data-mode');
          document.getElementById('login-form').classList.toggle('hidden', m !== 'login');
          document.getElementById('register-form').classList.toggle('hidden', m === 'login');
          document.getElementById('auth-tab-login').className = m === 'login' ? 'py-2 rounded-lg bg-white text-farm-800 shadow-sm' : 'py-2 rounded-lg text-slate-600';
          document.getElementById('auth-tab-register').className = m !== 'login' ? 'py-2 rounded-lg bg-white text-farm-800 shadow-sm' : 'py-2 rounded-lg text-slate-600';
        }
        else if (a === 'google-login') {
          if (!checkRateLimit('google_oauth', 2000)) return;
          if (!navigator.onLine) {
            showToast(tr('offline_msg'), 'error');
            return;
          }
          const redirectUrl = window.location.origin + window.location.pathname;
          const { data, error } = await withRetry(() => sb.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: redirectUrl,
              queryParams: { access_type: 'offline', prompt: 'select_account' }
            }
          }), 1, 500);
          if (error) {
            showToast('Google Login Error: ' + (error.message || 'Check Supabase Google OAuth'), 'error');
          } else if (data && data.url && window.top !== window.self) {
            try { window.top.location.href = data.url; } catch { window.location.href = data.url; }
          }
        }
        else if (a === 'logout') { await sb.auth.signOut(); state.user = null; state.profile = null; switchTab('market'); }
        else if (a === 'admin-refresh') { await loadV5AdminQueues(); }
        else if (a === 'admin-load-live') { await loadAdminLiveRecords(); }
        else if (a === 'moderate-mandi') {
          if (!requireAdminWrite('Approval')) return;
          const id = el.getAttribute('data-id');
          const st = el.getAttribute('data-st');
          if (isValidUUID(id) && (st === 'approved' || st === 'rejected')) {
            const { error } = await withRetry(() => sb.from('apmc_rates').update({ approval_status: st }).eq('id', id));
            if (error) { showToast(error.message || tr('toast_rls_blocked'), 'error'); return; }
            showToast(tr('toast_saved'));
            await loadApmcRates();
            await loadV5AdminQueues();
          }
        }
        else if (a === 'moderate-input') {
          if (!requireAdminWrite('Approval')) return;
          const id = el.getAttribute('data-id');
          const st = el.getAttribute('data-st');
          if (isValidUUID(id) && (st === 'approved' || st === 'rejected')) {
            const { error } = await withRetry(() => sb.from('agri_inputs').update({ approval_status: st }).eq('id', id));
            if (error) { showToast(error.message || tr('toast_rls_blocked'), 'error'); return; }
            showToast(tr('toast_saved'));
            await loadAgriInputs();
            await loadV5AdminQueues();
          }
        }
        else if (a === 'delete-mandi-rate') { await deleteRecordWithRetry('apmc_rates', el.getAttribute('data-id'), loadApmcRates); }
        else if (a === 'delete-agri-input') { await deleteRecordWithRetry('agri_inputs', el.getAttribute('data-id'), loadAgriInputs); }
        else if (a === 'delete-product-admin') { await deleteRecordWithRetry('products', el.getAttribute('data-id'), loadProducts); }
        else if (a === 'mark-product-sold') {
          const id = el.getAttribute('data-id');
          if (!state.user || !isValidUUID(id)) return;
          const { error } = await sb.from('products').update({ status: 'sold' }).eq('id', id).eq('seller_id', state.user.id);
          if (error) { showToast(error.message || tr('toast_del_fail'), 'error'); return; }
          showToast(tr('toast_saved')); loadMyListings(); loadProducts();
        }
        else if (a === 'delete-my-product') {
          const id = el.getAttribute('data-id');
          if (!state.user || !isValidUUID(id)) return;
          const { error } = await sb.from('products').delete().eq('id', id).eq('seller_id', state.user.id);
          if (error) { showToast(error.message || tr('toast_del_fail'), 'error'); return; }
          showToast(tr('toast_deleted')); loadMyListings(); loadProducts();
        }
        else if (a === 'open-voice') { openModal('voice-modal'); startVoiceListening(); }
        else if (a === 'toggle-voice-listen') startVoiceListening();
        else if (a === 'voice-example') processVoiceCommand(el.getAttribute('data-text'));
        else if (a === 'close-modal') { if (el.getAttribute('data-modal') === 'voice-modal') stopVoiceListening(); closeModal(el.getAttribute('data-modal')); }
      });

      document.getElementById('mandi-rate-form')?.addEventListener('submit', handleMandiRateSubmit);
      document.getElementById('agri-input-form')?.addEventListener('submit', handleAgriInputSubmit);
      document.getElementById('apmc-search')?.addEventListener('input', renderApmcRates);
      document.getElementById('apmc-state-filter')?.addEventListener('change', (ev) => { ev.target.dataset.userEdited = '1'; loadApmcRates(false); });
      document.getElementById('apmc-district-filter')?.addEventListener('input', debounce((ev) => { if (ev?.target) ev.target.dataset.userEdited = '1'; loadApmcRates(false); }, 450));
      document.getElementById('apmc-sort')?.addEventListener('change', renderApmcRates);
      document.getElementById('ai-price-scope')?.addEventListener('change', () => loadAiLiveCrops(false));
      document.getElementById('ai-crop-select')?.addEventListener('change', () => { const c = document.getElementById('ai-crop-custom'); if (c) c.value = ''; });
      document.getElementById('agri-input-search')?.addEventListener('input', renderAgriInputs);
      document.getElementById('transport-search')?.addEventListener('input', renderTransportList);
      document.getElementById('scheme-search')?.addEventListener('input', renderSchemes);
      document.getElementById('center-search')?.addEventListener('input', renderAgriCenters);
      document.getElementById('ai-multi-file')?.addEventListener('change', (ev) => handleMultimodalFileSelect(ev.target?.files?.[0] || null));
      const debouncedLoadProducts = debounce(loadProducts, 300);
      document.getElementById('search-input')?.addEventListener('input', debouncedLoadProducts);
      document.getElementById('district-filter')?.addEventListener('input', debouncedLoadProducts);
      document.getElementById('state-filter')?.addEventListener('change', loadProducts);

      document.getElementById('login-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const em = cleanText(document.getElementById('login-email').value, 120).toLowerCase();
        const pw = document.getElementById('login-password').value;
        if (!EMAIL_RE.test(em) || pw.length < 6) {
          showToast(state.lang === 'en' ? 'Valid email & password required.' : state.lang === 'hi' ? 'सही ईमेल और पासवर्ड डालें।' : 'સાચો ઈમેલ અને પાસવર્ડ નાખો.', 'error');
          return;
        }
        await withSubmitLock(e.target, async () => {
          const { error } = await withRetry(() => sb.auth.signInWithPassword({ email: em, password: pw }), 1, 500);
          if (error) showToast(error.message, 'error'); else switchTab('market');
        });
      });

      document.getElementById('register-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const em = cleanText(document.getElementById('reg-email').value, 120).toLowerCase();
        const pw = document.getElementById('reg-password').value;
        const nm = cleanText(document.getElementById('reg-name').value, 80);
        const mb = sanitizeIndianPhone(document.getElementById('reg-mobile').value);
        if (!EMAIL_RE.test(em) || pw.length < 8 || nm.length < 2 || !mb) {
          showToast(state.lang === 'en' ? 'Please fill valid details (8+ char password, 10-digit mobile).' : state.lang === 'hi' ? 'कृपया सभी सही विवरण भरें।' : 'કૃપા કરીને સાચી વિગતો ભરો.', 'error');
          return;
        }
        await withSubmitLock(e.target, async () => {
          const { error } = await withRetry(() => sb.auth.signUp({
            email: em,
            password: pw,
            options: { data: { full_name: nm, mobile_number: mb, role: document.getElementById('reg-role').value } }
          }), 1, 500);
          if (error) showToast(error.message, 'error'); else showToast(tr('toast_saved'));
        });
      });

      document.getElementById('profile-form')?.addEventListener('submit', async (e) => {
        e.preventDefault(); if (!state.user) return;
        const btn = e.target.querySelector('button[type="submit"]');
        const upi = cleanText(document.getElementById('p-upi').value, 96).toLowerCase();
        if (upi && !UPI_RE.test(upi)) {
          showToast(state.lang === 'en' ? 'Invalid UPI ID format (e.g. name@oksbi).' : state.lang === 'hi' ? 'अमान्य UPI ID।' : 'UPI ID ફોર્મેટ બરાબર નથી (દા.ત. name@oksbi).', 'error');
          return;
        }
        if (btn) btn.disabled = true;
        try {
          const { data, error } = await withRetry(() => sb.from('profiles').upsert({
            id: state.user.id,
            full_name: cleanText(document.getElementById('p-name').value, 80) || 'Farmer',
            mobile_number: sanitizeIndianPhone(document.getElementById('p-mobile').value) || null,
            village_city: cleanText(document.getElementById('p-village').value, 80) || null,
            district: cleanText(document.getElementById('p-district').value, 80) || null,
            state: cleanText(document.getElementById('p-state').value, 60) || 'Gujarat',
            upi_id: upi || null,
            allow_upi_payment: Boolean(document.getElementById('p-allow-upi')?.checked)
          }, { onConflict: 'id' }).select('*').single());
          if (error) {
            showToast(error.message, 'error');
          } else {
            state.profile = data;
            showToast(tr('toast_saved'));
            refreshAccountTab();
          }
        } finally {
          if (btn) btn.disabled = false;
        }
      });

      document.getElementById('admin-apmc-form')?.addEventListener('submit', async (e) => {
        e.preventDefault(); if (!requireAdminWrite('Admin rate publish')) return;
        const minP = safePositiveNumber(document.getElementById('ap-min').value, 0, 1000000);
        const maxP = safePositiveNumber(document.getElementById('ap-max').value, 0, 1000000);
        const modP = safePositiveNumber(document.getElementById('ap-modal').value, 0, 1000000);
        const cropTxt = cleanText(document.getElementById('ap-crop').value, 80);
        const yardTxt = cleanText(document.getElementById('ap-yard').value, 80);
        const distTxt = cleanText(document.getElementById('ap-dist').value, 60);
        if (!cropTxt || !yardTxt || !distTxt || minP === null || maxP === null || modP === null || maxP < minP) {
          showToast(state.lang === 'en' ? 'Invalid rates or fields.' : state.lang === 'hi' ? 'अमान्य भाव या विवरण।' : 'વિગતો અથવા ભાવ બરાબર નથી.', 'error');
          return;
        }
        await withSubmitLock(e.target, async () => {
          const { error } = await withRetry(() => sb.from('apmc_rates').insert({
            rate_category: document.getElementById('ap-cat').value,
            yard_name: yardTxt, district: distTxt,
            crop_name_gu: cropTxt, crop_name_en: cropTxt,
            min_price: minP, max_price: maxP, modal_price: modP,
            unit: cleanText(document.getElementById('ap-unit').value, 35) || '20 kg (મણ)',
            rate_date: new Date().toISOString().split('T')[0],
            submitted_by: state.user.id,
            approval_status: 'approved'
          }));
          if (error) showToast(error.message, 'error');
          else { e.target.reset(); showToast(tr('toast_saved')); loadApmcRates(); }
        });
      });

      document.getElementById('add-product-form')?.addEventListener('submit', async (e) => {
        e.preventDefault(); if (!state.user) return;
        const submitBtn = document.getElementById('np-submit-btn');
        const catId = document.getElementById('np-cat').value;
        const t = cleanText(document.getElementById('np-title-gu').value, 150);
        const q = safePositiveNumber(document.getElementById('np-qty').value, 0.1, 1000000);
        const pr = safePositiveNumber(document.getElementById('np-price').value, 1, 10000000);
        const unitVal = document.getElementById('np-unit').value;
        if (!isValidUUID(catId)) {
          showToast(state.lang === 'en' ? 'Please select a valid category.' : state.lang === 'hi' ? 'कृपया सही श्रेणी चुनें।' : 'કૃપા કરીને યોગ્ય કેટેગરી પસંદ કરો.', 'error');
          return;
        }
        if (t.length < 2 || !q || !pr || !CONFIG.ALLOWED_UNITS.includes(unitVal)) { showToast(state.lang === 'en' ? 'Please fill valid crop title, quantity & price.' : state.lang === 'hi' ? 'सही उपज नाम, मात्रा और भाव भरें।' : 'યોગ્ય ઉપજનું નામ, જથ્થો અને ભાવ ભરો.', 'error'); return; }

        let uploadedFilePath = '';
        try {
          if (submitBtn) submitBtn.disabled = true;
          const imagePaths = [];
          const fileInput = document.getElementById('np-image');
          if (fileInput && fileInput.files && fileInput.files[0]) {
            const cleanBlob = await sanitizeAndVerifyImage(fileInput.files[0]);
            if (cleanBlob) {
              const safeFileName = `${state.user.id}/${crypto.randomUUID()}.jpg`;
              const upRes = await sb.storage.from('product-images').upload(safeFileName, cleanBlob, {
                contentType: 'image/jpeg',
                upsert: false
              });
              if (upRes.error) throw upRes.error;
              uploadedFilePath = safeFileName;
              imagePaths.push(safeFileName);
            }
          }

          const { error } = await sb.from('products').insert({
            seller_id: state.user.id,
            category_id: catId,
            title_gu: t, title_hi: t, title_en: t,
            available_quantity: q,
            unit: unitVal,
            expected_price: pr,
            price_unit: unitVal,
            village: cleanText(document.getElementById('np-village').value, 80),
            district: cleanText(document.getElementById('np-district').value, 80),
            state: cleanText(document.getElementById('np-state').value, 60) || 'Gujarat',
            image_paths: imagePaths
          });
          if (error) {
            if (uploadedFilePath) {
              await sb.storage.from('product-images').remove([uploadedFilePath]).catch(() => {});
            }
            throw error;
          }
          e.target.reset();
          closeModal('add-product-modal');
          showToast(tr('toast_submitted_pending'));
          loadMyListings();
          loadProducts();
        } catch (err) {
          showToast(err?.message || 'Error submitting listing', 'error');
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      });

      document.getElementById('add-request-form')?.addEventListener('submit', async (e) => {
        e.preventDefault(); if (!state.user) return;
        const reqProd = cleanText(document.getElementById('nr-product').value, 150);
        const reqQty = safePositiveNumber(document.getElementById('nr-qty').value, 0.1, 1000000);
        const reqLoc = cleanText(document.getElementById('nr-loc').value, 100);
        const reqDist = cleanText(document.getElementById('nr-district').value, 80);
        const ph = sanitizeIndianPhone(document.getElementById('nr-phone').value);
        const unitVal = document.getElementById('nr-unit').value;
        if (reqProd.length < 2 || !reqQty || reqLoc.length < 2 || reqDist.length < 2 || !ph || !CONFIG.ALLOWED_UNITS.includes(unitVal)) {
          showToast(state.lang === 'en' ? 'Fill valid produce, quantity, location & 10-digit mobile.' : state.lang === 'hi' ? 'सही उपज, मात्रा, स्थान और 10 अंकों का मोबाइल नंबर डालें।' : 'યોગ્ય ઉપજ, જથ્થો, સ્થળ અને ૧૦ અંકનો મોબાઇલ નંબર નાખો.', 'error');
          return;
        }
        await withSubmitLock(e.target, async () => {
          const { error } = await withRetry(() => sb.from('buyer_requests').insert({
            buyer_id: state.user.id,
            product_required: reqProd,
            required_quantity: reqQty,
            unit: unitVal,
            delivery_location: reqLoc,
            district: reqDist,
            contact_number: ph,
            buyer_name: cleanText(state.profile?.full_name || state.user.email, 80)
          }));
          if (error) showToast(error.message, 'error');
          else { e.target.reset(); closeModal('add-request-modal'); showToast(tr('toast_saved')); loadBuyerRequests(); }
        });
      });

      document.getElementById('add-transport-form')?.addEventListener('submit', async (e) => {
        e.preventDefault(); if (!state.user) return;
        const drvNm = cleanText(document.getElementById('tr-name').value, 80);
        const vilNm = cleanText(document.getElementById('tr-village').value, 80);
        const distNm = cleanText(document.getElementById('tr-district').value, 80);
        const ph = sanitizeIndianPhone(document.getElementById('tr-mobile').value);
        if (drvNm.length < 2 || !vilNm || !distNm || !ph) {
          showToast(state.lang === 'en' ? 'Valid driver name, location & 10-digit mobile required.' : state.lang === 'hi' ? 'सही ड्राइवर नाम, स्थान और मोबाइल नंबर डालें।' : 'યોગ્ય ડ્રાઇવરનું નામ, ગામ-જિલ્લો અને ૧૦ અંકનો મોબાઇલ નંબર નાખો.', 'error');
          return;
        }
        await withSubmitLock(e.target, async () => {
          const { error } = await withRetry(() => sb.from('transport_providers').insert({
            owner_id: state.user.id,
            driver_name: drvNm,
            vehicle_type: cleanText(document.getElementById('tr-type').value, 60),
            mobile_number: ph,
            village: vilNm,
            district: distNm
          }));
          if (error) showToast(error.message, 'error');
          else { e.target.reset(); closeModal('add-transport-modal'); showToast(tr('toast_saved')); loadTransportList(); }
        });
      });

      function syncOnline() {
        document.getElementById('offline-banner')?.classList.toggle('hidden', navigator.onLine);
        if (navigator.onLine) loadProducts().catch(() => {});
      }
      window.addEventListener('online', syncOnline);
      window.addEventListener('offline', syncOnline);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { stopVoiceListening(); CONFIG.ALLOWED_MODALS.forEach(closeModal); } });

      async function initApp() {
        syncOnline();
        setLang(state.lang);

        async function syncUserProfile(userObj) {
          if (!userObj) { state.profile = null; return; }
          let { data: prof } = await withRetry(() => sb.from('profiles').select('*').eq('id', userObj.id).maybeSingle());
          if (!prof) {
            const meta = userObj.user_metadata || {};
            const fallbackName = cleanText(meta.full_name || meta.name || (userObj.email ? userObj.email.split('@')[0] : 'Farmer'), 80) || 'Farmer';
            await withRetry(() => sb.from('profiles').upsert({
              id: userObj.id,
              full_name: fallbackName,
              role: 'seller'
            }, { onConflict: 'id', ignoreDuplicates: true }));
            const retryProf = await withRetry(() => sb.from('profiles').select('*').eq('id', userObj.id).maybeSingle());
            prof = retryProf.data || { id: userObj.id, full_name: fallbackName, role: 'seller' };
          }
          state.profile = prof;
        }

        function cleanOAuthUrlFragment() {
          try {
            if (/[?#].*(access_token|refresh_token|code=|error_description=)/.test(window.location.href)) {
              const cleanUrl = window.location.origin + window.location.pathname;
              window.history.replaceState({}, document.title, cleanUrl);
            }
          } catch {}
        }

        let lastHydratedUid = null;
        sb.auth.onAuthStateChange(async (ev, newSession) => {
          const nextUser = newSession?.user || null;
          state.user = nextUser;
          const nextUid = nextUser?.id || null;
          if (nextUid !== lastHydratedUid || ev === 'SIGNED_IN' || ev === 'USER_UPDATED') {
            lastHydratedUid = nextUid;
            await syncUserProfile(nextUser);
          }
          if (ev === 'SIGNED_IN' && state.user) {
            cleanOAuthUrlFragment();
            showToast(state.lang === 'en' ? 'Signed in successfully!' : state.lang === 'hi' ? 'सफलतापूर्वक लॉगिन हुआ!' : 'લૉગિન સફળ થયું!');
          }
          refreshAccountTab();
          if (state.tab === 'sell') refreshSellTab();
        });

        await loadCategories();
        const { data: { session } } = await sb.auth.getSession();
        state.user = session?.user || null;
        if (state.user && state.user.id !== lastHydratedUid) {
          lastHydratedUid = state.user.id;
          await syncUserProfile(state.user);
        }
        refreshAccountTab();
        await loadProducts();
        refreshIcons();
      }
      window.addEventListener('unhandledrejection', (ev) => { ev.preventDefault(); });
      initApp();
    })();
  </script>
</body>
</html>
