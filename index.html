    body {
      font-family: 'Noto Sans Gujarati', 'Noto Sans Devanagari', 'Inter', system-ui, sans-serif;

      -webkit-tap-highlight-color: transparent;
      padding-bottom: 92px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-backdrop { background: rgba(15, 23, 42, 0.62); backdrop-filter: blur(3px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

<body class="text-slate-800 antialiased">

  <div id="offline-banner" class="hidden sticky top-0 z-50 bg-red-700 text-white text-xs font-bold px-4 py-2 text-center" data-i18n="offline_msg"></div>
  <div id="toast-container" role="status" aria-live="polite" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] w-[92%] max-w-md space-y-2 pointer-events-none"></div>

  <header class="sticky top-0 z-40 bg-farm-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 cursor-pointer min-w-0" data-action="nav-tab" data-tab="market">
        <div class="w-9 h-9 rounded-xl bg-white/15 border border-white/20 flex items-center justify-center text-xl shadow-inner shrink-0">🌾</div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-lg font-bold leading-tight tracking-wide flex items-center gap-1 truncate">
            KHEDUT SETU
            <span class="text-[10px] font-bold bg-amber-400/25 border border-amber-300/40 text-amber-100 px-1.5 py-0.5 rounded-md">✨ AI v5.0</span>
          </h1>
          <p class="text-[10px] sm:text-[11px] text-farm-100 leading-tight truncate" data-i18n="tagline"></p>
        </div>
      </div>

      <nav class="hidden md:flex items-center gap-1 text-sm font-medium" aria-label="Main Navigation">
        <button type="button" data-action="nav-tab" data-tab="market" data-nav="market" class="nav-desk px-3 py-1.5 rounded-lg hover:bg-white/10 transition" data-i18n="nav_market"></button>
        <button type="button" data-action="nav-tab" data-tab="ai_advisor" data-nav="ai_advisor" class="nav-desk px-3 py-1.5 rounded-lg hover:bg-white/10 transition" data-i18n="nav_ai"></button>
        <button type="button" data-action="nav-tab" data-tab="yard" data-nav="yard" class="nav-desk px-3 py-1.5 rounded-lg hover:bg-white/10 transition" data-i18n="nav_yard"></button>
        <button type="button" data-action="nav-tab" data-tab="sell" data-nav="sell" class="nav-desk px-3 py-1.5 rounded-lg hover:bg-white/10 transition" data-i18n="nav_sell"></button>
        <button type="button" data-action="nav-tab" data-tab="requests" data-nav="requests" class="nav-desk px-3 py-1.5 rounded-lg hover:bg-white/10 transition" data-i18n="nav_requests"></button>
        <button type="button" data-action="nav-tab" data-tab="account" data-nav="account" class="nav-desk px-3 py-1.5 rounded-lg hover:bg-white/10 transition" data-i18n="nav_account"></button>
      </nav>

      <div class="flex items-center gap-1.5 shrink-0">
        <div class="flex items-center gap-0.5 bg-farm-900/60 p-1 rounded-lg border border-white/15 text-[11px] font-semibold">
          <button type="button" data-action="set-lang" data-lang="gu" id="lang-gu" class="lang-btn px-1.5 py-1 rounded-md transition">ગુ</button>
          <button type="button" data-action="set-lang" data-lang="hi" id="lang-hi" class="lang-btn px-1.5 py-1 rounded-md transition">हिं</button>
          <button type="button" data-action="set-lang" data-lang="en" id="lang-en" class="lang-btn px-1.5 py-1 rounded-md transition">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3.5 py-4">

    <!-- TAB 1: MARKET -->
    <section id="tab-market" class="tab-view space-y-4 animate-fade">
      <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200/80 space-y-3">
        <div class="flex flex-col sm:flex-row gap-2.5">
          <div class="relative flex-1 flex items-center">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none"></i>
            <input id="search-input" type="text" maxlength="80" autocomplete="off"
              class="w-full pl-10 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-farm-600 focus:bg-white"
              data-i18n-placeholder="search_placeholder" />
            <button type="button" data-action="open-voice" class="absolute right-2 w-8 h-8 rounded-lg bg-farm-100 hover:bg-farm-200 text-farm-800 flex items-center justify-center transition">
              <i data-lucide="mic" class="w-4 h-4"></i>
            </button>
          </div>
          <div class="flex gap-2">
            <input id="district-filter" type="text" maxlength="60" autocomplete="off"
              class="flex-1 sm:w-44 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-farm-600 focus:bg-white"
              data-i18n-placeholder="district_placeholder" />
            <button type="button" data-action="reset-filters" title="Reset" class="px-3 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold transition">
              <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
        <div id="categories-strip" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>
      </div>

      <div class="bg-gradient-to-r from-emerald-900 via-farm-800 to-farm-700 rounded-2xl p-4 text-white space-y-3 shadow-sm">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div class="space-y-1">
            <div class="inline-flex items-center gap-1.5 text-[11px] font-bold bg-white/15 px-2.5 py-0.5 rounded-full text-amber-200">
              <span>✨ KHEDUT SETU v5.0</span>
              <span>•</span>
              <span data-i18n="ai_badge_sub"></span>
            </div>
            <h2 class="font-bold text-base sm:text-lg" data-i18n="hero_title"></h2>
            <p id="ai-pulse-summary" class="text-xs sm:text-sm text-farm-100"></p>
          </div>
          <div class="grid grid-cols-3 sm:flex gap-2 w-full sm:w-auto shrink-0">
            <button type="button" data-action="nav-tab" data-tab="yard" class="bg-harvest-500 hover:bg-harvest-600 text-white font-semibold text-xs px-3 py-2.5 rounded-xl shadow transition flex items-center justify-center gap-1">
              <span data-i18n="btn_daily_rates"></span>
            </button>
            <button type="button" data-action="nav-tab" data-tab="sell" class="bg-white/15 hover:bg-white/25 border border-white/25 text-white font-semibold text-xs px-3 py-2.5 rounded-xl transition flex items-center justify-center gap-1">
              <span data-i18n="btn_post_crop"></span>
            </button>
            <button type="button" data-action="nav-tab" data-tab="ai_advisor" class="bg-white/15 hover:bg-white/25 border border-white/25 text-white font-semibold text-xs px-3 py-2.5 rounded-xl transition flex items-center justify-center gap-1">
              <span data-i18n="btn_ai_doc_short"></span>
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
          <span data-i18n="latest_listings"></span>
          <span id="products-count" class="text-xs font-semibold bg-farm-100 text-farm-800 px-2 py-0.5 rounded-full">0</span>
        </h3>
        <button type="button" data-action="refresh-products" class="text-xs font-semibold text-farm-700 hover:underline flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span data-i18n="refresh"></span>
        </button>
      </div>

      <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
    </section>

    <!-- TAB 2: AI ADVISOR -->
    <section id="tab-ai_advisor" class="tab-view hidden space-y-4 animate-fade">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-lg font-bold text-slate-900" data-i18n="ai_hub_title"></h2>
            <p class="text-xs text-slate-500" data-i18n="ai_hub_sub"></p>
          </div>
          <div class="flex gap-1.5 bg-slate-100 p-1 rounded-xl w-full sm:w-fit overflow-x-auto no-scrollbar">
            <button type="button" data-action="ai-subtab" data-subtab="price" id="aisub-price" class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-bold bg-farm-700 text-white transition" data-i18n="aisub_price_btn"></button>
            <button type="button" data-action="ai-subtab" data-subtab="doctor" id="aisub-doctor" class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-white transition" data-i18n="aisub_doctor_btn"></button>
            <button type="button" data-action="ai-subtab" data-subtab="match" id="aisub-match" class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-white transition" data-i18n="aisub_match_btn"></button>
          </div>
        </div>
      </div>

      <div id="ai-panel-price" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h3 class="font-bold text-slate-900 text-base" data-i18n="ai_price_heading"></h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="ai_select_crop"></label>
            <select id="ai-crop-select" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="ai_qty_label"></label>
            <input id="ai-qty-input" type="number" min="1" max="10000" value="50" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="quality"></label>
            <select id="ai-qual-select" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"></select>
          </div>
        </div>
        <button type="button" data-action="run-ai-price" class="bg-farm-700 hover:bg-farm-800 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow" data-i18n="ai_calc_price_btn"></button>
        <div id="ai-price-output" class="bg-farm-50 border border-farm-200 rounded-2xl p-4 space-y-2 text-sm"></div>
      </div>

      <div id="ai-panel-doctor" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <h3 class="font-bold text-slate-900 text-base" data-i18n="ai_doc_heading"></h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="ai_doc_crop_lbl"></label>
            <input id="doc-crop" type="text" maxlength="80" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="ai_doc_sym_lbl"></label>
            <select id="doc-symptom" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm bg-white"></select>
          </div>
        </div>
        <textarea id="doc-extra" rows="2" maxlength="300" data-i18n-placeholder="ai_doc_extra_ph" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm"></textarea>
        <button type="button" data-action="run-ai-doctor" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow" data-i18n="ai_doc_btn"></button>
        <div id="ai-doctor-output" class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 space-y-2 text-sm"></div>
      </div>

      <div id="ai-panel-match" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
        <div class="flex items-center justify-between gap-2">
          <div>
            <h3 class="font-bold text-slate-900 text-base" data-i18n="ai_match_heading"></h3>
            <p class="text-xs text-slate-500" data-i18n="ai_match_sub"></p>
          </div>
          <button type="button" data-action="run-ai-match" class="px-3.5 py-2 rounded-xl bg-farm-700 text-white text-xs font-bold" data-i18n="ai_match_refresh"></button>
        </div>
        <div id="ai-match-output" class="space-y-2.5 text-sm"></div>
      </div>
    </section>

    <!-- TAB 3: MANDI RATES, AGRI INPUTS/MACHINERY & TRANSPORT -->
    <section id="tab-yard" class="tab-view hidden space-y-4 animate-fade">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-lg font-bold text-slate-900" data-i18n="yard_hub_title"></h2>
            <p class="text-xs text-slate-500" data-i18n="yard_hub_sub"></p>
          </div>
          <div class="flex gap-1.5 bg-slate-100 p-1 rounded-xl w-full sm:w-fit overflow-x-auto no-scrollbar">
            <button type="button" data-action="yard-subtab" data-subtab="apmc" id="subtab-apmc" class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-bold bg-farm-700 text-white transition" data-i18n="tab_apmc"></button>
            <button type="button" data-action="yard-subtab" data-subtab="inputs" id="subtab-inputs" class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-white transition" data-i18n="tab_inputs"></button>
            <button type="button" data-action="yard-subtab" data-subtab="transport" id="subtab-transport" class="shrink-0 px-3.5 py-2 rounded-lg text-xs font-bold text-slate-600 hover:bg-white transition" data-i18n="tab_transport"></button>
          </div>
        </div>
      </div>

      <!-- Subtab A: Daily Mandi Rates (Veg, Fruits, Flowers, Kathol, Anaj) + Daily Update & Admin Approval -->
      <div id="apmc-panel" class="space-y-3">
        <div class="bg-white rounded-2xl p-3 border border-slate-200 flex flex-wrap items-center justify-between gap-2">
          <div id="mandi-cat-chips" class="flex gap-1.5 overflow-x-auto no-scrollbar"></div>
          <button type="button" data-action="open-mandi-rate-modal" class="px-3.5 py-2 rounded-xl bg-harvest-500 hover:bg-harvest-600 text-white text-xs font-bold shrink-0 shadow-sm" data-i18n="btn_add_update_mandi"></button>
        </div>
        <div class="flex flex-col sm:flex-row gap-2">
          <input id="apmc-search" type="text" maxlength="60" data-i18n-placeholder="apmc_search_ph" class="flex-1 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-farm-600 focus:outline-none" />
          <button type="button" data-action="refresh-apmc" class="px-4 py-2.5 bg-farm-700 text-white text-xs font-bold rounded-xl" data-i18n="refresh"></button>
        </div>
        <div id="apmc-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>

      <!-- Subtab B: Dava, Biyaran, Khatar, Sadhano & Yantro -->
      <div id="inputs-panel" class="hidden space-y-3">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h3 class="font-bold text-slate-900 text-base" data-i18n="inputs_heading"></h3>
            <p class="text-xs text-slate-500" data-i18n="inputs_sub"></p>
          </div>
          <button type="button" data-action="open-agri-input-modal" class="px-3.5 py-2 rounded-xl bg-farm-700 hover:bg-farm-800 text-white text-xs font-bold shadow-sm" data-i18n="btn_add_update_input"></button>
        </div>
        <div id="agri-input-type-chips" class="flex gap-1.5 overflow-x-auto no-scrollbar"></div>
        <div class="flex gap-2">
          <input id="agri-input-search" type="text" maxlength="60" data-i18n-placeholder="input_search_ph" class="flex-1 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-farm-600 focus:outline-none" />
        </div>
        <div id="agri-inputs-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>

      <!-- Subtab C: Local Transport -->
      <div id="transport-panel" class="hidden space-y-3">
        <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center justify-between">
          <input id="transport-search" type="text" maxlength="60" data-i18n-placeholder="tr_search_ph" class="flex-1 px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-farm-600 focus:outline-none" />
          <button type="button" data-action="open-transport-modal" class="px-4 py-2.5 bg-farm-700 hover:bg-farm-800 text-white text-xs font-bold rounded-xl flex items-center justify-center gap-1.5 shadow-sm" data-i18n="btn_add_vehicle"></button>
        </div>
        <div id="transport-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </section>

    <!-- TAB 4: BUYER REQUESTS -->
    <section id="tab-requests" class="tab-view hidden space-y-4 animate-fade">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold text-slate-900" data-i18n="req_title"></h2>
          <p class="text-xs sm:text-sm text-slate-500 mt-0.5" data-i18n="req_sub"></p>
        </div>
        <button type="button" data-action="open-request-modal" class="bg-farm-700 hover:bg-farm-800 text-white font-semibold text-sm px-4 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span data-i18n="btn_add_req"></span>
        </button>
      </div>
      <div id="requests-list" class="grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
    </section>

    <!-- TAB 5: SELL -->
    <section id="tab-sell" class="tab-view hidden space-y-4 animate-fade">
      <div id="sell-guest-box" class="hidden bg-white rounded-2xl p-6 text-center shadow-sm border border-slate-200 space-y-3">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-farm-50 text-farm-700 flex items-center justify-center text-3xl">🚜</div>

      function populateSelects() {
        const aiCrop = document.getElementById('ai-crop-select');
        if (aiCrop) { const prev = aiCrop.value || 'paddy'; aiCrop.innerHTML = Object.keys(AI_CROPS).map((k) => `<option value="${k}">${escapeHtml(AI_CROPS[k][state.lang])}</option>`).join(''); aiCrop.value = prev; }

        state.lang = lang; localStorage.setItem('ks_lang', lang); document.documentElement.lang = lang;

        const act = document.getElementById(`lang-${lang}`);
        if (act) act.className = 'lang-btn px-1.5 py-1 rounded-md transition bg-white text-farm-900 font-bold shadow-sm';
        document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = tr(el.getAttribute('data-i18n')); });

        else if (a === 'run-ai-doctor') runAiDoctor();
        else if (a === 'run-ai-match') runAiMatch();
        else if (a === 'set-mandi-cat') { state.mandiCatFilter = el.getAttribute('data-cat') || 'all'; renderApmcRates(); }
        else if (a === 'set-agri-type') { state.agriInputTypeFilter = el.getAttribute('data-type') || 'all'; renderAgriInputs(); }
        else if (a === 'open-mandi-rate-modal') openMandiRateModal(null);
        else if (a === 'edit-mandi-rate') { const r = state.apmcRates.find((x) => x.id === el.getAttribute('data-id')); if (r) openMandiRateModal(r); }
        else if (a === 'open-agri-input-modal') openAgriInputModal(null);
        else if (a === 'edit-agri-input') { const it = state.agriInputs.find((x) => x.id === el.getAttribute('data-id')); if (it) openAgriInputModal(it); }
        else if (a === 'open-transport-modal') { if (!state.user) switchTab('account'); else openModal('add-transport-modal'); }
        else if (a === 'open-request-modal') { if (!state.user) switchTab('account'); else openModal('add-request-modal'); }
        else if (a === 'open-product-modal') { if (!state.user) switchTab('account'); else openModal('add-product-modal'); }
        else if (a === 'select-cat') { const id = el.getAttribute('data-id'); state.selectedCategory = isValidUUID(id) ? id : null; renderCategories(); loadProducts(); }
        else if (a === 'auth-mode') { const m = el.getAttribute('data-mode'); document.getElementById('login-form').classList.toggle('hidden', m !== 'login'); document.getElementById('register-form').classList.toggle('hidden', m === 'login'); }
        else if (a === 'google-login') await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + window.location.pathname } });
        else if (a === 'logout') { await sb.auth.signOut(); state.user = null; state.profile = null; switchTab('market'); }
        else if (a === 'admin-refresh') loadV5AdminQueues();
        else if (a === 'moderate-mandi') { const id = el.getAttribute('data-id'); if (isValidUUID(id)) { await sb.from('apmc_rates').update({ approval_status: el.getAttribute('data-st') }).eq('id', id); loadApmcRates(); loadV5AdminQueues(); } }
        else if (a === 'moderate-input') { const id = el.getAttribute('data-id'); if (isValidUUID(id)) { await sb.from('agri_inputs').update({ approval_status: el.getAttribute('data-st') }).eq('id', id); loadAgriInputs(); loadV5AdminQueues(); } }
        else if (a === 'open-voice') openModal('voice-modal');
        else if (a === 'close-modal') closeModal(el.getAttribute('data-modal'));
      });

      document.getElementById('mandi-rate-form')?.addEventListener('submit', handleMandiRateSubmit);
      document.getElementById('agri-input-form')?.addEventListener('submit', handleAgriInputSubmit);
      document.getElementById('apmc-search')?.addEventListener('input', renderApmcRates);
      document.getElementById('agri-input-search')?.addEventListener('input', renderAgriInputs);
      document.getElementById('transport-search')?.addEventListener('input', renderTransportList);
      document.getElementById('search-input')?.addEventListener('input', loadProducts);
      document.getElementById('district-filter')?.addEventListener('input', loadProducts);
      document.getElementById('login-form')?.addEventListener('submit', async (e) => { e.preventDefault(); const { error } = await sb.auth.signInWithPassword({ email: cleanText(document.getElementById('login-email').value, 120), password: document.getElementById('login-password').value }); if (error) showToast(error.message, 'error'); else switchTab('market'); });
      document.getElementById('register-form')?.addEventListener('submit', async (e) => { e.preventDefault(); const { error } = await sb.auth.signUp({ email: cleanText(document.getElementById('reg-email').value, 120), password: document.getElementById('reg-password').value, options: { data: { full_name: cleanText(document.getElementById('reg-name').value, 80), mobile_number: sanitizeIndianPhone(document.getElementById('reg-mobile').value), role: document.getElementById('reg-role').value } } }); if (error) showToast(error.message, 'error'); else showToast('OK'); });
      document.getElementById('profile-form')?.addEventListener('submit', async (e) => { e.preventDefault(); if (!state.user) return; const { error } = await sb.from('profiles').update({ full_name: cleanText(document.getElementById('p-name').value, 80), mobile_number: sanitizeIndianPhone(document.getElementById('p-mobile').value) || null, village_city: cleanText(document.getElementById('p-village').value, 80) || null, district: cleanText(document.getElementById('p-district').value, 80) || null, upi_id: cleanText(document.getElementById('p-upi').value, 96) || null }).eq('id', state.user.id); if (!error) { showToast('OK'); const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle(); state.profile = data; refreshAccountTab(); } });
      document.getElementById('admin-apmc-form')?.addEventListener('submit', async (e) => { e.preventDefault(); const { error } = await sb.from('apmc_rates').insert({ rate_category: document.getElementById('ap-cat').value, yard_name: cleanText(document.getElementById('ap-yard').value, 80), district: cleanText(document.getElementById('ap-dist').value, 60), crop_name_gu: cleanText(document.getElementById('ap-crop').value, 80), min_price: safePositiveNumber(document.getElementById('ap-min').value, 0, 1000000), max_price: safePositiveNumber(document.getElementById('ap-max').value, 0, 1000000), modal_price: safePositiveNumber(document.getElementById('ap-modal').value, 0, 1000000), unit: cleanText(document.getElementById('ap-unit').value, 35) || '20 kg (મણ)' }); if (!error) { e.target.reset(); showToast('OK'); loadApmcRates(); } });
      document.getElementById('add-product-form')?.addEventListener('submit', async (e) => { e.preventDefault(); if (!state.user) return; const t = cleanText(document.getElementById('np-title-gu').value, 150); const { error } = await sb.from('products').insert({ seller_id: state.user.id, category_id: document.getElementById('np-cat').value, title_gu: t, title_hi: t, title_en: t, available_quantity: safePositiveNumber(document.getElementById('np-qty').value, 0.1, 1000000), unit: document.getElementById('np-unit').value, expected_price: safePositiveNumber(document.getElementById('np-price').value, 1, 10000000), price_unit: document.getElementById('np-unit').value, village: cleanText(document.getElementById('np-village').value, 80), district: cleanText(document.getElementById('np-district').value, 80), state: 'Gujarat' }); if (!error) { closeModal('add-product-modal'); showToast('OK'); loadProducts(); } });
      document.getElementById('add-request-form')?.addEventListener('submit', async (e) => { e.preventDefault(); if (!state.user) return; const { error } = await sb.from('buyer_requests').insert({ buyer_id: state.user.id, product_required: cleanText(document.getElementById('nr-product').value, 150), required_quantity: safePositiveNumber(document.getElementById('nr-qty').value, 0.1, 1000000), unit: document.getElementById('nr-unit').value, delivery_location: cleanText(document.getElementById('nr-loc').value, 100), district: cleanText(document.getElementById('nr-district').value, 80), contact_number: sanitizeIndianPhone(document.getElementById('nr-phone').value), buyer_name: cleanText(state.profile?.full_name || state.user.email, 80) }); if (!error) { closeModal('add-request-modal'); loadBuyerRequests(); } });
      document.getElementById('add-transport-form')?.addEventListener('submit', async (e) => { e.preventDefault(); if (!state.user) return; const { error } = await sb.from('transport_providers').insert({ provider_id: state.user.id, driver_name: cleanText(document.getElementById('tr-name').value, 80), vehicle_type: document.getElementById('tr-type').value, mobile_number: sanitizeIndianPhone(document.getElementById('tr-mobile').value), village: cleanText(document.getElementById('tr-village').value, 80), district: cleanText(document.getElementById('tr-district').value, 80) }); if (!error) { closeModal('add-transport-modal'); showToast('OK'); loadTransportList(); } });

      async function initApp() {
        setLang(state.lang);
        await loadCategories();
        const { data: { session } } = await sb.auth.getSession();
        state.user = session?.user || null;
        if (state.user) { const { data: prof } = await sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle(); state.profile = prof; }
        refreshAccountTab();
        await loadProducts();
        refreshIcons();
      }
      initApp();
    })();
  </script>
</body>
</html>
